<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>GitHub Galaxy</title>
<style>
:root{--ink:#f5f6f4;--muted:#bdc2c2;--dim:#939a9d;--line:#29415e;--pass:#55dda0;--fail:#ff7180;--risk:#ffc268;--info:#8adbe9;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%;background:#030916}body{margin:0;color:var(--ink);font-family:var(--sans);min-width:320px;overflow:hidden}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--info);outline-offset:2px}
a{color:var(--info)}h1,h2,p{margin:0}.micro{font:700 10px/1.4 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.galaxy{height:100%;display:flex;flex-direction:column}.galaxyhead h1{font-size:21px;letter-spacing:-.04em}
.galaxy{background:#030916;overflow:hidden;border-color:#29415e}.galaxyhead{min-height:68px;display:flex;align-items:center;gap:18px;padding:12px 18px;border-bottom:1px solid #29415e;flex-wrap:wrap}.galaxyhead h2{font-size:21px;letter-spacing:-.04em}.galaxyhead .micro{color:#a8c2e0}.galaxytools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.galaxytools input,.galaxytools select{background:#0a1a2c;border:1px solid #36516e;color:#eaf5ff;border-radius:4px;padding:7px 9px;font:10px var(--mono)}.galaxytools input{width:180px}.galaxytools select{max-width:175px}.galaxystage{height:560px;position:relative;overflow:hidden;background:#030916}.galaxycanvas{position:absolute;inset:0;touch-action:none;cursor:grab}.galaxycanvas:active{cursor:grabbing}.galaxycanvas canvas{display:block;width:100%;height:100%}.galaxyvignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 36%,#03091677 82%,#030916b0 100%)}.galaxylabels{position:absolute;inset:0;pointer-events:none}.galaxy-core-label{position:absolute;left:0;top:0;display:grid;justify-items:center;gap:5px;white-space:nowrap;pointer-events:none;transition:opacity .4s ease-out}.galaxy-core-label[hidden]{display:none}.galaxy-core-label i{width:1px;height:26px;background:linear-gradient(#ffe7c400,#ffe7c4cc)}.galaxy-core-label b{color:#fff7ec;font:600 11px/1 var(--sans);letter-spacing:.42em;margin-right:-.42em;text-shadow:0 0 14px #ffc98a99,0 0 2px #000}.galaxy-core-label small{color:#a9bfdc;font:8px/1 var(--mono);letter-spacing:.28em;margin-right:-.28em;opacity:.8}.galaxy-branch-label{position:absolute;color:var(--branch-tone);font:700 8px var(--mono);letter-spacing:.12em;text-shadow:0 0 10px var(--branch-tone);white-space:nowrap;transform:translate(-50%,-50%)}.galaxytooltip{position:absolute;z-index:7;max-width:min(360px,80%);padding:8px 10px;background:#08182bef;border:1px solid #9bc8fa;color:#eff7ff;border-radius:4px;font:11px/1.4 var(--mono);pointer-events:none;box-shadow:0 5px 30px #000b}.galaxyempty{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);max-width:420px;padding:18px 22px;border:1px solid #6687ab;border-radius:7px;background:#0c1930ee;color:#d1ddec;text-align:center;font:12px/1.5 var(--mono)}.galaxyinspect{position:absolute;z-index:6;right:15px;top:15px;bottom:58px;width:clamp(320px,28vw,420px);max-width:calc(100% - 30px);padding:15px;background:#08182bd9;border:1px solid #779fc999;border-radius:9px;box-shadow:0 16px 46px #000b;backdrop-filter:blur(15px);overflow:auto;opacity:0;transform:translateX(30px);pointer-events:none;transition:opacity .28s ease-out,transform .28s cubic-bezier(.22,1,.36,1);scrollbar-color:#547492 transparent}.galaxyinspect.open{opacity:1;transform:translateX(0);pointer-events:auto;transition-duration:.4s}.galaxyinspect[hidden]{display:block;visibility:hidden}.galaxyinspect #galaxyClose{position:absolute;z-index:2;right:13px;top:12px;background:transparent;border:0;color:var(--ink);font-size:17px}.galaxyinspect #galaxyDetail{display:grid;gap:10px;margin-top:0;font:11px/1.4 var(--mono);color:#c4d2e1;overflow-wrap:anywhere}.galaxy-panel-sticky{position:sticky;z-index:1;top:-15px;margin:-15px -15px 0;padding:15px 46px 12px 15px;background:linear-gradient(180deg,#08182bf7 80%,#08182bd8);border-bottom:1px solid #3a536d;display:grid;gap:4px}.galaxy-panel-sticky strong{font:700 18px/1.2 var(--sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.galaxy-crumb{white-space:nowrap}.galaxy-repo-meta{font:10px var(--mono);color:#b7cbe0}.galaxy-stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:5px}.galaxy-stat-grid span{display:flex;gap:5px;align-items:baseline;padding:4px 5px;border:1px solid #294661;background:#0d2135a6;color:#98b5d2;font:8px var(--mono);letter-spacing:.06em}.galaxy-stat-grid b{color:#eff8ff;font-size:11px}.galaxy-commit-card{display:grid;gap:4px;padding:10px;border:1px solid #496988;background:#0c2035b8;border-radius:6px}.galaxy-commit-card b{color:#eff8ff;font:700 12px/1.35 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.galaxy-commit-card small{color:#9eb5cb;font:9px/1.4 var(--mono)}.galaxy-accordion{border-top:1px solid #3a536d}.galaxy-accordion>button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:9px 1px;border:0;background:transparent;color:#a8c9e9;font:700 9px var(--mono);letter-spacing:.11em;text-align:left}.galaxy-accordion>button span{font-size:15px;transition:transform .2s ease-out}.galaxy-accordion.open>button span{transform:rotate(180deg)}.galaxy-accordion-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s ease-out}.galaxy-accordion.open>.galaxy-accordion-body{grid-template-rows:1fr}.galaxy-accordion-body>div{overflow:hidden;min-height:0}.galaxy-branch-row,.galaxy-commit-row,.galaxy-detail-link{min-width:0;display:grid;align-items:center;gap:7px}.galaxy-branch-row{grid-template-columns:6px minmax(0,1fr) 58px;padding:5px 2px;color:#d5e6f7}.galaxy-branch-row i,.galaxy-commit-row i{width:6px;height:6px;border-radius:50%;box-shadow:0 0 8px currentColor}.galaxy-branch-row span,.galaxy-commit-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.galaxy-branch-row small{color:#8ea9c3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.galaxy-commit-list{max-height:252px;overflow-y:auto;display:grid;align-content:start;padding-right:2px;scrollbar-color:#547492 transparent}.galaxy-commit-row{grid-template-columns:7px minmax(0,1fr) 44px;width:100%;min-height:28px;padding:5px 3px;border:0;border-bottom:1px solid #233d57;background:transparent;color:#dcecff;text-align:left;font:10px var(--mono);flex-shrink:0;transition:background .15s ease-out,color .15s ease-out}.galaxy-commit-row:hover,.galaxy-commit-row.hovered,.galaxy-commit-row.selected{background:#153755b3;color:#fff}.galaxy-commit-row time{color:#91a9bf;white-space:nowrap;text-align:right}.galaxy-older-row,.galaxy-empty-row{display:block;padding:8px 3px;color:#90abc3;font:10px var(--mono)}.galaxy-detail-link{grid-template-columns:8px minmax(0,1fr);padding:6px 2px;color:#dcecff;text-decoration:none;font:10px/1.35 var(--mono)}.galaxy-detail-link:hover{color:#fff}.galaxy-detail-link i{width:6px;height:6px;border-radius:50%;background:#6a8aa5}.galaxy-detail-link i.action-success{background:var(--pass);box-shadow:0 0 8px var(--pass)}.galaxy-detail-link i.action-failure,.galaxy-detail-link i.action-cancelled{background:var(--fail);box-shadow:0 0 8px var(--fail)}.galaxy-detail-link i.action-in_progress,.galaxy-detail-link i.action-queued{background:var(--risk);box-shadow:0 0 8px var(--risk)}.galaxy-panel-loading{padding:18px 1px;color:#a8c2e0}.galaxyinspect #galaxyDetail.switching{opacity:.15;transition:opacity .15s ease-out}.galaxyhud{position:absolute;left:0;right:0;bottom:0;min-height:48px;display:flex;align-items:center;gap:14px;padding:12px 18px;background:linear-gradient(transparent,#030916ec);color:#bfd2e8;font:9px var(--mono);letter-spacing:.07em}.galaxyhud button{background:#132a43;border:1px solid #729bc7;color:#eaf4ff;border-radius:4px;padding:5px 8px;font:9px var(--mono)}.galaxyhud #galaxySelection{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.galaxycanvas:focus-visible{outline:2px solid #9bc8fa;outline-offset:-3px}@media(max-width:700px){.galaxyhead{gap:8px}.galaxytools{width:100%;margin:0}.galaxytools input{flex:1;min-width:80px}.galaxytools select{max-width:42%}.galaxystage{height:500px}.galaxyinspect{right:8px;top:8px;bottom:54px;max-width:calc(100% - 16px)}.galaxyhud{flex-wrap:wrap}.galaxy-core-label b{font-size:10px}}
.galaxytools{position:relative}.galaxy-results{position:absolute;z-index:8;top:38px;left:0;width:min(290px,80vw);max-height:245px;overflow:auto;background:#071629f5;border:1px solid #6085a9;box-shadow:0 12px 28px #000c;padding:5px;display:grid;gap:3px}.galaxy-results[hidden]{display:none}.galaxy-results button{background:#0d2136;color:#e7f2ff;border:1px solid #294765;padding:7px;text-align:left;font:11px var(--mono);display:flex;justify-content:space-between;gap:8px}.galaxy-results button:hover{border-color:#9bc8fa}.galaxy-results small{color:#96b7d5}
.galaxyinspect>#galaxyClose+span.micro{display:none}
.galaxy-detail-notice{padding:8px 10px;border:1px solid #5c4b35;background:#241b1088;color:#dfbd86;border-radius:5px;font:9px/1.4 var(--mono)}
.galaxy-atmosphere{position:absolute;z-index:1;inset:-12%;pointer-events:none;opacity:.28;mix-blend-mode:screen;filter:blur(12px);background:radial-gradient(ellipse 35% 42% at 5% 16%,#347dbb66 0%,#173c8052 32%,transparent 72%),radial-gradient(ellipse 43% 32% at 1% 86%,#58368b64 0%,#1e3f8260 36%,transparent 74%),radial-gradient(ellipse 36% 42% at 94% 14%,#3566935c 0%,#172f7159 38%,transparent 72%),radial-gradient(ellipse 45% 35% at 96% 83%,#236b7a58 0%,#29417a50 36%,transparent 74%);animation:galaxyFogDrift 24s ease-in-out infinite alternate}.galaxy-atmosphere:after{content:"";position:absolute;inset:0;opacity:.72;background:radial-gradient(circle at 12% 52%,#b2dcff55 0 1px,transparent 3px),radial-gradient(circle at 87% 64%,#82dce755 0 1px,transparent 3px),radial-gradient(circle at 71% 15%,#c6aeff44 0 1px,transparent 3px);background-size:103px 131px,149px 173px,211px 197px;animation:galaxyDustDrift 34s linear infinite}@keyframes galaxyFogDrift{to{transform:translate3d(2.5%,-1.5%,0) scale(1.04)}}@keyframes galaxyDustDrift{to{transform:translate3d(-4%,3%,0)}}@media(prefers-reduced-motion:reduce){.galaxy-atmosphere,.galaxy-atmosphere:after{animation:none}}
.galaxyvignette{z-index:2}.galaxylabels{z-index:3}.galaxyhud{z-index:4}
.galaxycanvas{z-index:2}.galaxyvignette{z-index:3}.galaxylabels{z-index:4}
.galaxy-toggle{display:flex;align-items:center;gap:4px;color:#aac5de;font:8px var(--mono);letter-spacing:.06em;white-space:nowrap}.galaxy-toggle input{accent-color:#9bc8fa}.galaxy-arm-label{position:absolute;left:0;top:0;color:#8ea4bf;font:600 7px var(--mono);letter-spacing:.09em;text-shadow:0 0 6px #03091699;white-space:nowrap;opacity:.62;will-change:transform;transition:opacity .35s ease-out,color .2s ease-out}.galaxy-arm-label.off{opacity:0}.galaxy-arm-label.hot{color:#eef6ff;opacity:1;text-shadow:0 0 10px #80bfff}
.galaxy-cache-chip{padding:3px 5px;border:1px solid #55708a55;border-radius:999px;color:#8199af;background:#07152699;font:8px var(--mono);letter-spacing:.06em;white-space:nowrap}
.galaxy-exposure{position:absolute;left:14px;top:14px;padding:5px 7px;border:1px solid #4f6e8b88;background:#06111dcc;color:#b7d5ed;font:8px var(--mono);letter-spacing:.05em}
.galaxystage{height:auto;flex:1;min-height:420px}
.galaxytools input[type=checkbox]{width:auto;padding:0}.galaxytools{gap:12px}
</style>
</head>
<body>
<main class="galaxy" aria-label="GitHub galaxy"><div class="galaxyhead"><div><span class="micro">GITHUB / ACCOUNT GALAXY</span><h1>GitHub Galaxy</h1></div><span id="galaxyStatus" class="micro">Connecting to GitHub</span><div class="galaxytools"><input id="galaxySearch" type="search" placeholder="SEARCH REPOSITORIES" aria-label="Search repositories"><div id="galaxyResults" class="galaxy-results" hidden></div><select id="galaxyLanguages" aria-label="Filter language"><option value="">ALL LANGUAGES</option></select><label class="galaxy-toggle"><input id="galaxyForks" type="checkbox" checked> FORKS</label><label class="galaxy-toggle"><input id="galaxyArchived" type="checkbox" checked> ARCHIVED</label></div></div><div class="galaxystage" id="galaxyStage"><div id="galaxyCanvasHost" class="galaxycanvas" tabindex="0" role="group" aria-label="GitHub galaxy: drag to orbit, Shift drag to pan, Alt scroll to zoom, click a repository for detail"></div><div class="galaxy-atmosphere" aria-hidden="true"></div><div class="galaxyvignette" aria-hidden="true"></div><div id="galaxyLabels" class="galaxylabels" aria-hidden="true"></div><div id="galaxyTooltip" class="galaxytooltip" hidden></div><div id="galaxyEmpty" class="galaxyempty" hidden></div><aside id="galaxyInspect" class="galaxyinspect" hidden><button id="galaxyClose" type="button" aria-label="Close repository details">✕</button><span class="micro">REPOSITORY / BRANCHES / COMMITS / PRS / ACTIONS</span><div id="galaxyDetail"></div></aside><div class="galaxyhud"><span id="galaxyCount">CONNECTING TO GITHUB</span><span id="galaxyOwner"></span><span id="galaxySelection">SELECT A REPOSITORY</span><button id="galaxyBack" type="button" hidden>BACK TO GALAXY</button></div></div></main>
<script type="module" src="/galaxy.js"></script>
</body>
</html>
