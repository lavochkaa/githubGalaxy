name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build snapshot
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          # The built-in token reads public data; add a GALAXY_TOKEN secret for a higher rate limit.
          GITHUB_TOKEN: ${{ secrets.GALAXY_TOKEN || github.token }}
          GITHUB_GALAXY_CACHE: ${{ runner.temp }}/galaxy-cache.json
        run: python build_site.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
