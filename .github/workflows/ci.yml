name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint
        run: pip install ruff && ruff check .
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript tests
        run: for test in tests/*.mjs; do node "$test"; done
      - name: Syntax check
        run: python -m py_compile server.py github_galaxy_data.py
